<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Imagens Sobrepostas e Arrastáveis</title>
  <!-- Carrega os estilos definidos para a página de imagens. -->
  <link rel="stylesheet" href="../css/imagens.css">
</head>

<body>

  <div class="toolbar">
    <label for="seletor-imagens">Selecionar pasta com imagens</label>
    <input id="seletor-imagens" type="file" accept="image/*" webkitdirectory directory multiple>
    <span id="status-imagens" aria-live="polite">Nenhuma imagem selecionada</span>
  </div>

  <!-- Agrupa imagens sobrepostas que podem ser movidas com o mouse. -->
  <div class="container">
  </div>

  <!-- Ativa a lógica que permite arrastar e reorganizar as imagens. -->
  <script src="../js/imagens.js"></script>

</body>

</html>
