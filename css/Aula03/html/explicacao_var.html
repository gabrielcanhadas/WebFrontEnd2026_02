<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tema claro e escuro</title>
    <!-- Os estilos e as variáveis CSS foram separados no arquivo correspondente. -->
    <link rel="stylesheet" href="../css/explicacao_var.css">
  </head>
  <body>
    <header class="header">
      <h1>Meu Projeto</h1>
      <!-- A classe dark no body demonstra o tema escuro definido no CSS. 
           A classe dark é adicionada ou removida pelo script explicacao_var.js. -->
      <button id="themeButton" type="button" aria-pressed="false">🌙 Modo escuro</button>
    </header>

    <main class="container">
      <section class="card">
        <h2>Olá!</h2>
        <p>Este é um exemplo de tema claro e escuro utilizando variáveis CSS.</p>
        <button class="primary-button" type="button">Saiba mais</button>
      </section>
    </main>

    <!-- O script alterna a classe dark no body quando o botão é acionado. -->
    <script src="../js/explicacao_var.js"></script>
  </body>
</html>
