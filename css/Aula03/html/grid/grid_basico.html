<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid: linhas e colunas</title>
    <link rel="stylesheet" href="../../css/grid/grid_basico.css">
</head>

<body>
    <main>
        <h1>Grid: linhas e colunas</h1>
        <p>Use <code>display: grid</code> para organizar itens em linhas e colunas.</p>

        <section class="exemplo">
            <h2>Colunas com medidas diferentes</h2>
            <div class="grade colunas">
                <div class="item">1fr</div>
                <div class="item">2fr</div>
                <div class="item">1fr</div>
            </div>
        </section>

        <section class="exemplo">
            <h2>Linhas e colunas definidas</h2>
            <div class="grade linhas">
                <div class="item">Linha 1</div>
                <div class="item">Linha 1</div>
                <div class="item">Linha 2</div>
                <div class="item">Linha 2</div>
                <div class="item">Linha 3</div>
                <div class="item">Linha 3</div>
            </div>
        </section>

        <section class="exemplo">
            <h2>Repetição e largura mínima</h2>
            <div class="grade repeticao">
                <div class="item">A</div>
                <div class="item">B</div>
                <div class="item">C</div>
                <div class="item">D</div>
            </div>
        </section>
    </main>
</body>

</html>
