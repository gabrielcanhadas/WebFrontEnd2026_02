<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid: alinhamento e espaçamento</title>
    <link rel="stylesheet" href="../../css/grid/alinhamento_grid.css">
</head>

<body>
    <main>
        <h1>Alinhamento e espaçamento</h1>

        <section class="exemplo">
            <h2>Alinhamento dos itens: justify-items e align-items</h2>
            <div class="grade itens">
                <div class="item inicio">Início</div>
                <div class="item centro">Centro</div>
                <div class="item fim">Fim</div>
                <div class="item esticar">Esticar</div>
            </div>
        </section>

        <section class="exemplo">
            <h2>Atalho place-items</h2>
            <div class="grade place">
                <div class="item">Centro nos dois eixos</div>
            </div>
        </section>

        <section class="exemplo">
            <h2>Alinhamento das trilhas: justify-content e align-content</h2>
            <div class="grade trilhas">
                <div class="item">1</div>
                <div class="item">2</div>
                <div class="item">3</div>
                <div class="item">4</div>
            </div>
        </section>

        <section class="exemplo">
            <h2>Alinhamento individual com place-self</h2>
            <div class="grade individual">
                <div class="item">Padrão</div>
                <div class="item destaque">place-self: center</div>
            </div>
        </section>
    </main>
</body>

</html>
