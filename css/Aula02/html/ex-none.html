<html>

<head>
  <title>Exemplo none.html</title>
  <style>
    #oculto {
      display: none;
    }

    li {
      display: inline;
    }
  </style>
</head>

<body>
  <h3>Esse valor é utilizado para ocultar um elemento, de forma que a página será exibida
    como se o elemento não estivesse lá. Ou seja, o documento HTML é renderizado
    como se o elemento não existisse.</h3>
  <p>Exemplo de alteração da exibição de uma lista:</p>
  <ul>
    <li><a href="#">Item 1</a></li>
    <li id="oculto"><a href="#">Item 2</a></li>
    <li><a href="#">Item 3</a></li>
  </ul>
</body>

</html>
