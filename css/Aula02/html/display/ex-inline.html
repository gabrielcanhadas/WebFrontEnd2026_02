<!DOCTYPE html>
<html>

<head>
	<title>Exemplo inline.html</title>
	<style>
		span {
			background-color: yellow;
		}

		li {
			display: inline-block;
		}
	</style>
</head>

<body>
	<h3>Por padrão, elementos inline ocupam apenas a largura e altura necessárias. Eles
		não precisam começar em uma nova linha, <span>podendo ficar lado a lado de outros
			elementos.</span> São exemplos de elementos do tipo inline:</h3>

	<p>Exemplo de parágrafo com <span>elemento span</span>.</p>

	<ul>
		<li><a href="#">Link 1</a></li>
		<li><a href="#">Link 2</a></li>
		<li><a href="#">Link 3</a></li>
		<li><a href="#">Link 4</a></li>
	</ul>


</body>

</html>
