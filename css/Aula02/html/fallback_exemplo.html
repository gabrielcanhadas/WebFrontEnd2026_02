<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <!-- Define a codificação e a adaptação da página para telas menores. -->
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Exemplo de Fallback</title>
  <!-- Arquivo CSS que demonstra fallbacks para fontes, fundos e layouts. -->
  <link rel="stylesheet" href="../css/explicacao_fallback.css" />
</head>

<body>
  <!-- Contêiner: no CSS, "display: block" é o fallback para "display: flex". -->
  <div class="container">
    <!-- Card: recebe uma cor sólida antes do gradiente, que funciona como fallback. -->
    <div class="card">
      <h1>Exemplo de Fallback</h1>
      <p>Este card usa uma cor de fundo e um gradiente.</p>

      <!-- Navegadores com suporte a WebP usam source; os demais exibem o PNG em img. -->
      <picture>
        <source srcset="../imagens/ods4.webp" width="300" height="200" type="image/webp" />
        <!-- Esta imagem PNG é o fallback para navegadores sem suporte a WebP. -->
        <img src="../imagens/ods4.png" alt="Imagem de exemplo" />
      </picture>
      <!-- O CSS declara duas cores para o botão; a primeira é o fallback da segunda. -->

      <button class="botao">Botão de exemplo</button>
    </div>
  </div>
</body>

</html>
