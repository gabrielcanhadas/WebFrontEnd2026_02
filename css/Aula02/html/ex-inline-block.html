<!DOCTYPE html>
<html>

<head>
  <title>Exemplo inline-block.html</title>
  <style>
    .caixa {
      display: inline-block;
      width: 100px;
      height: 100px;
      margin: 10px;
      text-align: center;
      line-height: 100px;
      color: white;
      font-weight: bold;
    }

    .caixa-1 {
      background-color: #ff5722;
    }

    .caixa-2 {
      background-color: #4caf50;
    }

    .caixa-3 {
      background-color: #2196f3;
    }
  </style>
</head>

<body>
  <div class="caixa caixa-1">Caixa 1</div>
  <div class="caixa caixa-2">Caixa 2</div>
  <div class="caixa caixa-3">Caixa 3</div>
</body>

</html>
