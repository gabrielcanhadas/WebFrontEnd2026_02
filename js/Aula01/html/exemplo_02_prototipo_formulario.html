<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>Cadastro de Produtos - Exemplo com prototype no .js</title>
  </head>
  <body>
    <h1>Cadastro de Produtos - Exemplo com prototype no .js</h1>

    <form id="formProduto">
      <div>
        <label>Nome do Produto:</label>
        <input type="text" id="nome" required />
      </div>

      <div>
        <label>Preço:</label>
        <input type="number" id="preco" step="0.01" required />
      </div>

      <div>
        <label>Desconto (%):</label>
        <input type="number" id="desconto" min="0" max="100" value="0" />
      </div>

      <button type="submit">Adicionar Produto</button>
    </form>

    <div id="resultado"></div>

    <script src="../js/exemplo02_prototipo_formulario.js"></script>
  </body>
</html>
