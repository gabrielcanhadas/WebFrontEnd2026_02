<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Exemplo 1</title>
    <style>
      .box {
        border: 2px solid black;
        margin: 20px;
      }
      p {
        color: rgb(255, 255, 255);
        background-color: gray;
      }
      .italico {
        font-style: italic;
      }
      .underline {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <h1>Elemento H1</h1>

    <div>Elemento div</div>

    <p>Primeiro elemento p.</p>
    <p>Segundo elemento p.</p>

    <div class="box">
      <p>Elemento p dentro de uma div.</p>
    </div>

    <p>Clique no botão para alterar a cor de todos os elementos p.</p>

    <button onclick="alteraCor()">Alterar cor</button>

    <script>
      function alteraCor() {
        var elementos = document.querySelectorAll("p");
        var i;
        for (i = 0; i < elementos.length; i++) {
          if (elementos[i].style.backgroundColor == "blue") {
            elementos[i].style.backgroundColor = "gray";
            elementos[i].classList.remove("italico", "underline");
          } else {
            elementos[i].style.backgroundColor = "blue";
            elementos[i].classList.add("italico", "underline");
          }
        }
      }
    </script>
  </body>
</html>
