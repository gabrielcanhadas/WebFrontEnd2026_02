<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Exemplo de Formulário</title>
</head>

<body>
    <h2>Formulário</h2>
    <form>
        <!-- Nome completo -->
        <label for="nome">Nome completo:</label><br>
        <input type="text" id="nome" name="nome" required><br><br>

        <!-- Idade -->
        <label for="idade">Idade:</label><br>
        <input type="number" id="idade" name="idade" min="18" max="120" required><br><br>

        <!-- Email -->
        <label for="email">Email:</label><br>
        <input type="email" id="email" name="email" placeholder="insira um e-mail válido" required><br><br>

        <!-- Conteúdo de maior interesse -->
        <label for="interesse">Conteúdo de maior interesse:</label><br>
        <select id="interesse" name="interesse">
            <option value="html">HTML</option>
            <option value="css">CSS</option>
            <option value="javascript" selected>JavaScript</option>
        </select><br><br>

        <!-- Opinião -->
        <label for="opiniao">Deixe sua opinião:</label><br>
        <textarea id="opiniao" name="opiniao" rows="5" cols="30"></textarea><br><br>

        <!-- Senha -->
        <label for="senha">Senha:</label><br>
        <input type="password" id="senha" name="senha" required><br><br>

        <!-- Botão enviar -->
        <input type="submit" value="Enviar">
    </form>
</body>

</html>
